<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bocs Sain Drum Pad</title>
    <style>
        :root { 
            --pad-color: #2a2a2a; 
            --pad-active: #00ff88; 
            --bg-color: #111;
        }
        
        body { 
            margin: 0; 
            background: var(--bg-color); 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior-y: contain; 
        }

        .nav-link { 
            color: #888; 
            text-decoration: none; 
            margin-bottom: 30px; 
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover { color: #fff; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            width: 90vw; 
            max-width: 500px; 
            aspect-ratio: 1/1; 
        }

        .pad { 
            background: var(--pad-color); 
            border: 2px solid #333; 
            border-radius: 8px; 
            cursor: pointer; 
            
            /* Enforce immediate touch registration and disable double-tap zoom */
            touch-action: manipulation; 
            transition: background 0.05s, transform 0.05s;
            
            /* Prevent text selection and native OS long-press context menus */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; 
        }

        .pad:active, .pad.active { 
            background: var(--pad-active); 
            border-color: var(--pad-active);
            transform: scale(0.96);
        }

        #status {
            color: #888;
            margin-top: 20px;
            font-size: 14px;
            height: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <a href="/Clean-start/index.html" class="nav-link">← Back to Bocs Sain</a>
    
    <div class="grid" id="pad-grid">
        </div>

    <div id="status">Initializing Synth Engine...</div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        const padGrid = document.getElementById('pad-grid');
        const statusEl = document.getElementById('status');
        const audioBuffers = new Array(16);

        // 1. Map exactly 16 relative paths (using the 4 sounds repeatedly for a full pad layout)
const SAMPLE_PATHS = [
    './sounds/kick.wav', './sounds/snare.wav', './sounds/hat.wav', './sounds/tom.wav',
    './sounds/kick.wav', './sounds/snare.wav', './sounds/hat.wav', './sounds/tom.wav',
    './sounds/kick drum.wav', './sounds/snare.wav', './sounds/hat.wav', './sounds/hhopen.wav',
    './sounds/kick drum.wav', './sounds/snare.wav', './sounds/hat.wav', './sounds/hhclose.wav'
];

// 2. Fetch and decode into memory asynchronously
async function preloadSamples() {
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Downloading samples into memory...';
    
    try {
        const promises = SAMPLE_PATHS.map(async (path, index) => {
            const response = await fetch(path);
            if (!response.ok) throw new Error(`HTTP ${response.status} for ${path}`);
            
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[index] = await audioCtx.decodeAudioData(arrayBuffer);
        });
        
        // Block initialization until all 16 tracks are downloaded and processed
        await Promise.all(promises);
        
        statusEl.textContent = 'System Ready. Pads loaded.';
        statusEl.style.color = '#00ff88';
    } catch (error) {
        console.error('Preload failed:', error);
        statusEl.textContent = 'FATAL ERROR: Fetch blocked. Are you running a local HTTP server?';
        statusEl.style.color = '#ff4444';
    }
}

// 3. Execution Execution
preloadSamples().then(initPads);

        // --- 2. LOCAL FILE PROCESSING ---
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'audio/*';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);

        let targetPadIndex = null;
        const HOLD_THRESHOLD = 600; // 600ms required to trigger upload menu

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || targetPadIndex === null) return;

            try {
                statusEl.textContent = `Decoding ${file.name}...`;
                statusEl.style.color = '#ffaa00';

                const arrayBuffer = await file.arrayBuffer();
                audioBuffers[targetPadIndex] = await audioCtx.decodeAudioData(arrayBuffer);
                
                statusEl.textContent = `Loaded: ${file.name} to Pad ${targetPadIndex + 1}`;
                statusEl.style.color = '#00ff88';
            } catch (err) {
                console.error('File decode failed:', err);
                statusEl.textContent = 'Error: Invalid audio format.';
                statusEl.style.color = '#ff4444';
            } finally {
                fileInput.value = ''; // Reset input to allow reloading the same file
            }
        });

        // --- 3. AUDIO PLAYBACK ---
        function playSample(index) {
            if (!audioBuffers[index]) return;
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[index];
            source.connect(audioCtx.destination);
            source.start(0); // Hardware-level zero-latency trigger
        }

        // --- 4. PAD INITIALIZATION & TIMER LOGIC ---
        function initPads() {
            for (let i = 0; i < 16; i++) {
                const pad = document.createElement('button');
                pad.className = 'pad';
                pad.dataset.index = i;
                
                let holdTimer;

                // Disable right-click context menus on desktop to match mobile behavior
                pad.addEventListener('contextmenu', (e) => e.preventDefault());

                pad.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    
                    // Web Audio policy: Must resume context on first interaction
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    // Fire audio instantly to preserve instrument playability
                    playSample(i);
                    pad.classList.add('active');

                    // Start the clock for the custom file loader
                    holdTimer = setTimeout(() => {
                        targetPadIndex = i;
                        fileInput.click();
                    }, HOLD_THRESHOLD);
                });

                // Failsafe: Abort the timer if the interaction ends or is interrupted
                const cancelHold = () => {
                    clearTimeout(holdTimer);
                    pad.classList.remove('active');
                };

                pad.addEventListener('pointerup', cancelHold);
                pad.addEventListener('pointerleave', cancelHold);
                pad.addEventListener('pointercancel', cancelHold);

                padGrid.appendChild(pad);
            }
        }

        // Boot system sequentially
        generateDefaultSounds();
        initPads();
    </script>
</body>
</html>
