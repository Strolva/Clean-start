<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bocs Sain Drum Pad</title>
    <style>
        :root { 
            --pad-color: #2a2a2a; 
            --pad-active: #00ff88; 
            --bg-color: #111;
        }
        
        body { 
            margin: 0; 
            background: var(--bg-color); 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            /* Prevent pull-to-refresh and swipe navigation on mobile */
            overscroll-behavior-y: contain; 
        }

        .nav-link { 
            color: #888; 
            text-decoration: none; 
            margin-bottom: 30px; 
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover { color: #fff; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            width: 90vw; 
            max-width: 500px; 
            aspect-ratio: 1/1; 
        }

        .pad { 
            background: var(--pad-color); 
            border: 2px solid #333; 
            border-radius: 8px; 
            cursor: pointer; 
            /* Disables double-tap to zoom on mobile, enforcing immediate touch registration */
            touch-action: manipulation; 
            transition: background 0.05s, transform 0.05s;
            /* Prevent text selection highlighting on rapid taps */
            -webkit-user-select: none;
            user-select: none;
        }

        .pad:active, .pad.active { 
            background: var(--pad-active); 
            border-color: var(--pad-active);
            transform: scale(0.96);
        }

        #status {
            color: #ff4444;
            margin-top: 20px;
            font-size: 14px;
            height: 20px;
        }
        /* Add to existing CSS */
.pad {
    position: relative; /* Required for absolute positioning of children */
    /* ... existing pad styles ... */
}

.folder-icon {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    fill: #666;
    cursor: pointer;
    z-index: 10;
    transition: fill 0.2s;
}

.folder-icon:hover {
    fill: #fff;
}
    </style>
</head>
<body>

    <a href="/Clean-start/index.html" class="nav-link">← Back to Bocs Sain</a>
    
    <div class="grid" id="pad-grid">
        </div>

    <div id="status">Loading Audio Engine...</div>

    <script>
        // Use standard or webkit-prefixed AudioContext for Safari compatibility
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        const padGrid = document.getElementById('pad-grid');
        const statusEl = document.getElementById('status');

        // Replace these with your actual audio asset URLs hosted on bocssain.cymru
        // Using a public domain percussion sample for testing
        const testSampleUrl = 'https://actions.google.com/sounds/v1/percussions/ambient_tom.ogg';
        const SAMPLE_URLS = Array(16).fill(testSampleUrl); 
        const audioBuffers = new Array(16);

        async function loadSamples() {
            try {
                const promises = SAMPLE_URLS.map(async (url, index) => {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    audioBuffers[index] = await audioCtx.decodeAudioData(arrayBuffer);
                });
                
                await Promise.all(promises);
                statusEl.textContent = 'System Ready. Tap a pad to unlock audio.';
                statusEl.style.color = '#888';
            } catch (err) {
                console.error('Audio asset loading failed:', err);
                statusEl.textContent = 'Error: Failed to fetch audio buffers (Check CORS or paths).';
            }
        }

        function playSample(index) {
            if (!audioBuffers[index]) return;

            // Instantiate a transient BufferSource for low latency
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[index];
            source.connect(audioCtx.destination);
            
            // Execute immediately on the hardware audio thread
            source.start(0);
        }

        function initPads() {
            f// 1. Create a single, hidden file input for the entire application
const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'audio/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);

let targetPadIndex = null;

// 2. Handle the local file decoding
fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || targetPadIndex === null) return;

    try {
        statusEl.textContent = `Decoding ${file.name}...`;
        statusEl.style.color = '#ffaa00';

        // Read file to memory and decode
        const arrayBuffer = await file.arrayBuffer();
        const decodedAudio = await audioCtx.decodeAudioData(arrayBuffer);
        
        // Overwrite the existing buffer
        audioBuffers[targetPadIndex] = decodedAudio;
        
        statusEl.textContent = `Loaded: ${file.name}`;
        statusEl.style.color = '#00ff88';
    } catch (err) {
        console.error('Failed to decode local audio file:', err);
        statusEl.textContent = 'Error: Invalid audio file format.';
        statusEl.style.color = '#ff4444';
    } finally {
        // Reset the input so the same file can be loaded again if needed
        fileInput.value = ''; 
    }
});

// 3. Updated Pad Initialization
function initPads() {
    for (let i = 0; i < 16; i++) {
        const pad = document.createElement('button');
        pad.className = 'pad';
        pad.dataset.index = i;

        // SVG Folder Icon
        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.setAttribute('class', 'folder-icon');
        icon.innerHTML = `<path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>`;

        // Routing the icon click to the hidden file input
        icon.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation(); // CRITICAL: Prevents the drum pad from striking
            targetPadIndex = i;
            fileInput.click();
        });

        pad.appendChild(icon);

        pad.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            playSample(i);
            
            pad.classList.add('active');
            setTimeout(() => pad.classList.remove('active'), 100);
        });

        pad.addEventListener('pointerup', () => pad.classList.remove('active'));
        pad.addEventListener('pointerleave', () => pad.classList.remove('active'));

        padGrid.appendChild(pad);
    }
}
        }

        // Initialize system
        loadSamples().then(initPads);
    </script>
</body>
</html>
