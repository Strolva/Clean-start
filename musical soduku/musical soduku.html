<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentatonic Grid Symphony</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --grid-bg: #34495e;
            --cell-clue: #cfd8dc;
            --cell-empty: #ffffff;
            --accent-color: #1abc9c;
            --conflict-color: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        h1 {
            margin-bottom: 8px;
            color: #2c3e50;
            text-align: center;
        }

        /* Top Mode Switcher Bar */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            background: #e2e8f0;
            padding: 6px;
            border-radius: 8px;
        }

        .mode-btn {
            background: transparent;
            color: #4a5568;
            border: none;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: #cbd5e1;
            color: #1a202c;
        }

        .mode-btn.active {
            background: #1abc9c;
            color: white;
            box-shadow: 0 2px 6px rgba(26, 188, 156, 0.4);
        }

        #mode-description {
            margin-bottom: 20px;
            text-align: center;
            max-width: 580px;
            line-height: 1.5;
            font-size: 0.95rem;
            color: #555;
            min-height: 42px;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 40px 1fr;
            grid-template-rows: 40px 1fr;
            gap: 5px;
            align-items: center;
            justify-items: center;
        }

        .top-triggers {
            grid-column: 2;
            grid-row: 1;
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 4px;
            justify-items: center;
        }

        .side-triggers {
            grid-column: 1;
            grid-row: 2;
            display: grid;
            grid-template-rows: repeat(5, 60px);
            gap: 4px;
            align-items: center;
        }

        #sudoku-container {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-template-rows: repeat(5, 60px);
            gap: 4px;
            background: var(--grid-bg);
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .trigger-btn {
            background: var(--grid-bg);
            color: #fff;
            border: none;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .trigger-btn:hover { background: var(--accent-color); }
        .trigger-btn:active { transform: scale(0.9); }

        .cell {
            width: 60px;
            height: 60px;
            background: var(--cell-empty);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, filter 0.2s, background-color 0.3s, color 0.3s;
            position: relative;
        }

        .cell:hover { filter: brightness(0.92); }
        .cell:active { transform: scale(0.95); }

        /* Clue / Locked Cell Styles */
        .cell.clue-hint {
            background-color: var(--cell-clue);
            color: #2c3e50;
            cursor: not-allowed;
            font-weight: 800;
        }
        .cell.clue-hint:hover { filter: none; }

        /* Lock badge for Medium / Ear modes */
        .mode-medium .cell.clue-hint::after,
        .mode-ear .cell.clue-hint::after {
            content: "🔒";
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Note icon badge for Medium mode */
        .mode-medium .cell.has-note::after {
            content: "🎵";
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Conflict indication */
        .cell.conflict {
            background-color: #ffcdd2 !important;
            color: var(--conflict-color) !important;
            animation: shake 0.2s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        #controls {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button.action-btn {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: background 0.2s;
        }

        button.action-btn:hover { background: #2980b9; }
        #random-btn { background: #9b59b6; }
        #random-btn:hover { background: #8e44ad; }
        #check-btn { background: #2ecc71; }
        #check-btn:hover { background: #27ae60; }

        #message {
            margin-top: 18px;
            font-weight: bold;
            font-size: 1.15rem;
            min-height: 28px;
            text-align: center;
        }
    </style>
</head>
<body class="mode-easy">

    <h1>Pentatonic Grid Symphony</h1>

    <!-- Top Mode Selector -->
    <div class="mode-selector">
        <button class="mode-btn active" id="btn-easy" onclick="setMode('easy')">Easy Mode</button>
        <button class="mode-btn" id="btn-medium" onclick="setMode('medium')">Medium (Musical Sudoku)</button>
        <button class="mode-btn" id="btn-ear" onclick="setMode('ear')">Pure Ear Symphony</button>
    </div>

    <p id="mode-description"></p>

    <div class="game-layout">
        <div class="top-triggers" id="top-triggers"></div>
        <div class="side-triggers" id="side-triggers"></div>
        <div id="sudoku-container"></div>
    </div>

    <div id="controls">
        <button class="action-btn" id="random-btn" onclick="generateNewPuzzle()">Generate New Puzzle</button>
        <button class="action-btn" id="check-btn" onclick="checkFullSymphony()">Check Symphony</button>
        <button class="action-btn" onclick="resetToCurrentClues()">Reset Board</button>
        <button class="action-btn" id="homeBtn" onclick="window.location.href='/Clean-start/index.html'">◀ Home</button>
    </div>

    <div id="message"></div>

<script>
    let audioCtx = null;
    let currentMode = 'easy'; // 'easy' | 'medium' | 'ear'

    const frequencies = { 'A': 440.00, 'C': 523.25, 'D': 587.33, 'E': 659.25, 'G': 783.99 };
    const notesList = ['A', 'C', 'D', 'E', 'G'];
    const cyclesList = ['', 'A', 'C', 'D', 'E', 'G'];

    let currentBoard = Array(25).fill('');
    let initialClues = Array(25).fill('');

    const modeDescriptions = {
        'easy': '<strong>Easy Mode:</strong> Letters (A, C, D, E, G) are visible on all placed and clue cells. Click to cycle forward, right-click to cycle backward.',
        'medium': '<strong>Medium (Musical Sudoku):</strong> Starting clues are locked (🔒). Placed notes show musical markers (🎵). Rely on ear checks and playback triggers!',
        'ear': '<strong>Pure Ear Symphony:</strong> Ultimate relative pitch test. No letters shown. Click 🔒 clues to hear their pitch and solve entirely by ear.'
    };

    function setMode(mode) {
        currentMode = mode;
        document.body.className = `mode-${mode}`;
        
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');
        
        document.getElementById('mode-description').innerHTML = modeDescriptions[mode];
        renderCells();
    }

    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error("Audio Context initialization failed:", e);
            }
        }
    }

    function playNote(note, duration = 0.5) {
        if (!note || !frequencies[note]) return;
        initAudio();
        if (!audioCtx) return;
        
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequencies[note], audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    }

    function playSequence(noteArray) {
        let delay = 0;
        noteArray.forEach(note => {
            if (note !== '') {
                setTimeout(() => playNote(note, 0.4), delay);
                delay += 250;
            }
        });
    }

    function generateValidGrid() {
        let grid = Array(25).fill('');
        
        function isValidPlacement(g, row, col, note) {
            for (let i = 0; i < 5; i++) {
                if (g[row * 5 + i] === note) return false;
                if (g[i * 5 + col] === note) return false;
            }
            return true;
        }

        function solve(idx) {
            if (idx === 25) return true;
            let row = Math.floor(idx / 5);
            let col = idx % 5;
            let shuffled = [...notesList].sort(() => Math.random() - 0.5);
            
            for (let note of shuffled) {
                if (isValidPlacement(grid, row, col, note)) {
                    grid[idx] = note;
                    if (solve(idx + 1)) return true;
                    grid[idx] = '';
                }
            }
            return false;
        }

        solve(0);
        return grid;
    }

    function generateNewPuzzle() {
        const perfectSolution = generateValidGrid();
        initialClues = Array(25).fill('');
        
        let indices = [];
        while (indices.length < 11) {
            let r = Math.floor(Math.random() * 25);
            if (!indices.includes(r)) indices.push(r);
        }

        indices.forEach(idx => {
            initialClues[idx] = perfectSolution[idx];
        });

        resetToCurrentClues();
    }

    function buildTriggers() {
        const topTriggers = document.getElementById('top-triggers');
        const sideTriggers = document.getElementById('side-triggers');
        topTriggers.innerHTML = '';
        sideTriggers.innerHTML = '';

        for (let i = 0; i < 5; i++) {
            const colBtn = document.createElement('button');
            colBtn.className = 'trigger-btn';
            colBtn.textContent = '▼';
            colBtn.addEventListener('click', () => {
                let colNotes = [];
                for (let r = 0; r < 5; r++) colNotes.push(currentBoard[r * 5 + i]);
                playSequence(colNotes);
            });
            topTriggers.appendChild(colBtn);

            const rowBtn = document.createElement('button');
            rowBtn.className = 'trigger-btn';
            rowBtn.textContent = '▶';
            rowBtn.addEventListener('click', () => {
                let rowNotes = [];
                for (let c = 0; c < 5; c++) rowNotes.push(currentBoard[i * 5 + c]);
                playSequence(rowNotes);
            });
            sideTriggers.appendChild(rowBtn);
        }
    }

    function renderCells() {
        for (let index = 0; index < 25; index++) {
            const cell = document.getElementById(`cell-${index}`);
            if (!cell) continue;

            const isClue = initialClues[index] !== '';
            const val = currentBoard[index];

            if (currentMode === 'easy') {
                cell.textContent = val;
                cell.classList.remove('has-note');
            } else if (currentMode === 'medium') {
                cell.textContent = '';
                if (!isClue && val !== '') {
                    cell.classList.add('has-note');
                } else {
                    cell.classList.remove('has-note');
                }
            } else if (currentMode === 'ear') {
                cell.textContent = (!isClue && val !== '') ? '🎵' : '';
                cell.classList.remove('has-note');
            }
        }
        scanForConflicts();
    }

    function resetToCurrentClues() {
        const container = document.getElementById('sudoku-container');
        container.innerHTML = '';
        currentBoard = [...initialClues];

        for (let index = 0; index < 25; index++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${index}`;

            if (initialClues[index] !== '') {
                cell.classList.add('clue-hint');
                cell.addEventListener('click', () => playNote(initialClues[index]));
            } else {
                cell.addEventListener('click', () => cycleNote(index, 1));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    cycleNote(index, -1);
                });
            }

            container.appendChild(cell);
        }
        document.getElementById('message').textContent = '';
        renderCells();
    }

    function cycleNote(index, direction) {
        let currentNote = currentBoard[index];
        let currentIndex = cyclesList.indexOf(currentNote);
        
        let nextIndex = (currentIndex + direction + cyclesList.length) % cyclesList.length;
        let nextNote = cyclesList[nextIndex];
        
        currentBoard[index] = nextNote;
        if (nextNote !== '') playNote(nextNote);

        renderCells();
    }

    function scanForConflicts() {
        for (let i = 0; i < 25; i++) {
            const el = document.getElementById(`cell-${i}`);
            if (el) el.classList.remove('conflict');
        }

        for (let index = 0; index < 25; index++) {
            let note = currentBoard[index];
            if (note === '') continue;

            const row = Math.floor(index / 5);
            const col = index % 5;
            let hasConflict = false;

            for (let j = 0; j < 5; j++) {
                let targetIdx = row * 5 + j;
                if (targetIdx !== index && currentBoard[targetIdx] === note) hasConflict = true;
            }

            for (let i = 0; i < 5; i++) {
                let targetIdx = i * 5 + col;
                if (targetIdx !== index && currentBoard[targetIdx] === note) hasConflict = true;
            }

            if (hasConflict) {
                const el = document.getElementById(`cell-${index}`);
                if (el) el.classList.add('conflict');
            }
        }
    }

    function checkFullSymphony() {
        const msg = document.getElementById('message');
        
        if (currentBoard.includes('')) {
            msg.style.color = '#e67e22';
            msg.textContent = "The board isn't completely filled yet!";
            return;
        }

        let conflicts = document.querySelectorAll('.conflict');
        if (conflicts.length > 0) {
            msg.style.color = '#e74c3c';
            msg.textContent = "Dissonance! Resolve conflicting notes.";
            return;
        }

        const isUnique5 = (arr) => new Set(arr).size === 5;

        for (let i = 0; i < 5; i++) {
            let row = []; let col = [];
            for (let j = 0; j < 5; j++) {
                row.push(currentBoard[i * 5 + j]);
                col.push(currentBoard[j * 5 + i]);
            }
            if (!isUnique5(row) || !isUnique5(col)) {
                msg.style.color = '#e74c3c';
                msg.textContent = "Validation error inside rows or columns.";
                return;
            }
        }

        msg.style.color = '#2ecc71';
        msg.textContent = "🎉 Perfect Harmony! Solved flawlessly!";
        playSequence(['A', 'C', 'D', 'E', 'G']);
    }

    window.addEventListener('DOMContentLoaded', () => {
        buildTriggers();
        setMode('easy');
        generateNewPuzzle();
    });
</script>
</body>
</html>
