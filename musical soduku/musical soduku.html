<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musical Audio Slide Symphony</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --panel-bg: #1e293b;
        }

        body { 
            background: var(--bg-color); 
            color: var(--accent-cyan); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 10px 40px; 
            overflow-x: hidden;
            -webkit-user-select: none; 
            user-select: none;
        }

        #top-bar {
            width: 100%; 
            max-width: 440px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px;
        }
        #homeBtn { 
            background: #334155; 
            color: #fff; 
            padding: 9px 14px; 
            font-size: 0.9rem; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
            transition: background 0.2s;
        }
        #homeBtn:hover { background: #475569; }

        /* Top Mode Selector */
        .mode-selector {
            display: flex;
            gap: 6px;
            background: #1e293b;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            justify-content: center;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px 6px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .mode-btn:hover { color: #fff; }
        .mode-btn.active {
            background: var(--accent-cyan);
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(56, 189, 248, 0.35);
        }

        #grid-controls { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: var(--panel-bg); 
            padding: 5px; 
            border-radius: 8px;
        }
        .stepper-btn { 
            background: #334155; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 7px 11px; 
            font-size: 0.95rem; 
            cursor: pointer; 
            touch-action: manipulation; 
        }
        .stepper-btn:active { background: #475569; }
        #grid-size-label { font-weight: bold; width: 36px; text-align: center; color: #fff; font-size: 0.9rem; }

        #controls { 
            margin-bottom: 16px; 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 100%; 
            max-width: 440px;
        }
        .btn { 
            padding: 9px 13px; 
            border-radius: 8px; 
            border: none; 
            font-size: 0.85rem;
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .btn-audio { background: #38bdf8; color: #0f172a; }
        .btn-image { background: #a855f7; color: #fff; }
        .btn-record { background: #f59e0b; color: #0f172a; }
        .btn-record.recording { background: #ef4444; color: #fff; animation: pulseRecord 1s infinite; }
        .btn-random { background: #6366f1; color: #fff; display: none; }
        #refBtn { background: #22c55e; color: #fff; display: none; }
        #stopBtn { background: #ef4444; color: #fff; display: none; }

        @keyframes pulseRecord {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #grid-container { 
            position: relative; 
            padding: 10px; 
            background: var(--panel-bg); 
            border-radius: 12px; 
            transition: all 0.4s ease;
            width: 100%; 
            max-width: 400px; 
            box-sizing: border-box;
        }
        #ghost-wave { 
            position: absolute; 
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            width: calc(100% - 20px); 
            height: calc(100% - 20px); 
            opacity: 0.2; 
            pointer-events: none; 
        }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(var(--cols, 3), 1fr); 
            gap: 6px; 
            width: 100%; 
            position: relative; 
        }
        .piece { 
            background: rgba(30, 41, 59, 0.95); 
            cursor: pointer; 
            border-radius: 6px; 
            border: 2px solid #475569; 
            overflow: hidden; 
            aspect-ratio: 1 / 1;
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative; 
            touch-action: manipulation; 
            transition: border-color 0.2s, transform 0.1s, background-color 0.2s;
            font-size: 1.8rem;
            color: #64748b;
        }
        .piece:active { transform: scale(0.96); }
        .piece.correct { border-color: #0ea5e9; }
        
        /* Blank/missing slide slot */
        .piece.empty {
            background: #0f172a !important;
            border: 2px dashed #334155 !important;
            cursor: default;
            box-shadow: inset 0px 0px 10px rgba(0,0,0,0.5);
            background-image: none !important;
        }

        #status { 
            margin: 14px 0 6px; 
            font-weight: bold; 
            min-height: 20px; 
            text-align: center; 
            font-size: 0.9rem;
            max-width: 420px;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0px #38bdf8; }
            50% { transform: scale(1.02); box-shadow: 0 0 25px #38bdf8; }
            100% { transform: scale(1); box-shadow: 0 0 0px #38bdf8; }
        }
        .victory { animation: pulse 2s infinite ease-in-out; border: 2px solid #22c55e; }
    </style>
</head>
<body>

    <div id="top-bar">
        <button id="homeBtn" onclick="window.location.href='/Clean-start/index.html'">◀ Home</button>
        <div id="grid-controls">
            <button class="stepper-btn" onclick="changeGridSize(-1)">➖</button>
            <span id="grid-size-label">3x3</span>
            <button class="stepper-btn" onclick="changeGridSize(1)">➕</button>
        </div>
    </div>

    <!-- Mode Selector Navigation -->
    <div class="mode-selector">
        <button class="mode-btn active" id="btn-mode-easy" onclick="setMode('easy')">Easy (Audio & Image)</button>
        <button class="mode-btn" id="btn-mode-medium" onclick="setMode('medium')">Medium (Waveform)</button>
        <button class="mode-btn" id="btn-mode-hard" onclick="setMode('hard')">Hard (Pure Audio)</button>
    </div>

    <div id="controls">
        <label class="btn btn-audio">
            📂 LOAD AUDIO
            <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
        </label>

        <label class="btn btn-image" id="labelImageUpload">
            🖼️ LOAD IMAGE
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
        </label>
        
        <button id="recordBtn" class="btn btn-record">🎤 RECORD</button>
        <button id="randomBtn" class="btn btn-random" onclick="manualShuffle()">🔀 SHUFFLE</button>
        <button id="refBtn" class="btn" onclick="playReference()">REF AUDIO</button>
        <button id="stopBtn" class="btn" onclick="stopEverything()">STOP</button>
    </div>

    <div id="grid-container">
        <canvas id="ghost-wave"></canvas>
        <div id="grid" style="--cols: 3;"></div>
    </div>

    <p id="status">Upload or record audio to build your sliding puzzle!</p>

    <script>
        let audioCtx, mainBuffer;
        let activeSources = []; 
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        let currentMode = 'easy'; // 'easy' | 'medium' | 'hard'
        let gridSize = 3; 
        let totalPieces = gridSize * gridSize;
        let pieces = [];
        let emptyIndex = null;
        
        let waveformImageSrc = null; 
        let uploadedImageSrc = null;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-mode-${mode}`).classList.add('active');

            const imgUploadBtn = document.getElementById('labelImageUpload');
            const ghostCanvas = document.getElementById('ghost-wave');

            if (mode === 'easy') {
                imgUploadBtn.style.display = 'inline-flex';
                ghostCanvas.style.display = 'block';
            } else if (mode === 'medium') {
                imgUploadBtn.style.display = 'none';
                ghostCanvas.style.display = 'block';
            } else if (mode === 'hard') {
                imgUploadBtn.style.display = 'none';
                ghostCanvas.style.display = 'none';
            }

            updateGhostCanvas();
            render();
        }

        function isSolvable(arr, width) {
            let inversions = 0;
            const values = arr.filter(v => v !== null);
            for (let i = 0; i < values.length; i++) {
                for (let j = i + 1; j < values.length; j++) {
                    if (values[i] > values[j]) inversions++;
                }
            }
            if (width % 2 !== 0) {
                return inversions % 2 === 0;
            } else {
                const emptyRow = Math.floor(arr.indexOf(null) / width);
                const rowFromBottom = width - emptyRow;
                return (rowFromBottom % 2 === 0) ? (inversions % 2 !== 0) : (inversions % 2 === 0);
            }
        }

        function scramblePieces() {
            let pool = Array.from({length: totalPieces - 1}, (_, i) => i);
            do {
                pool.sort(() => Math.random() - 0.5);
                pieces = [...pool, null];
            } while (!isSolvable(pieces, gridSize) || pieces.every((p, i) => (i === totalPieces - 1 ? p === null : p === i)));
            emptyIndex = totalPieces - 1;
        }
        scramblePieces(); 

        function manualShuffle() {
            if (!mainBuffer) return;
            stopEverything();
            scramblePieces();
            document.getElementById('grid-container').classList.remove('victory');
            document.getElementById('status').innerText = "Matrix scrambled! Slide the tiles into position.";
            render();
        }

        function changeGridSize(dir) {
            let newSize = gridSize + dir;
            if (newSize >= 3 && newSize <= 5) {
                gridSize = newSize;
                totalPieces = gridSize * gridSize;
                
                document.getElementById('grid-size-label').innerText = `${gridSize}x${gridSize}`;
                document.getElementById('grid').style.setProperty('--cols', gridSize);
                
                scramblePieces();
                stopEverything();
                document.getElementById('grid-container').classList.remove('victory');
                
                if (mainBuffer) {
                    document.getElementById('status').innerText = `Matrix updated to ${gridSize}x${gridSize}!`;
                    generateWaveformGridImage();
                }
                updateGhostCanvas();
                render();
            }
        }

        function initAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        async function processAudioData(arrayBuffer) {
            const status = document.getElementById('status');
            status.innerText = "Decoding Audio Framework...";
            try {
                mainBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                document.getElementById('refBtn').style.display = 'inline-block';
                document.getElementById('stopBtn').style.display = 'inline-block';
                document.getElementById('randomBtn').style.display = 'inline-block';
                
                status.innerText = "Audio loaded! Slide the pieces adjacent to the empty spot.";
                
                scramblePieces();
                document.getElementById('grid-container').classList.remove('victory');
                
                generateWaveformGridImage();
                updateGhostCanvas();
                render();
            } catch (e) {
                status.innerText = "❌ Error reading audio file!";
                console.error(e);
            }
        }

        document.getElementById('audioUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            initAudioCtx();
            const reader = new FileReader();
            reader.onload = async function(ev) { await processAudioData(ev.target.result); };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                uploadedImageSrc = ev.target.result;
                updateGhostCanvas();
                render(); 
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('recordBtn').addEventListener('click', async () => {
            const recordBtn = document.getElementById('recordBtn');
            const status = document.getElementById('status');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = async () => {
                        initAudioCtx();
                        const audioBlob = new Blob(audioChunks);
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        await processAudioData(arrayBuffer);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = "🛑 STOP";
                    recordBtn.classList.add('recording');
                    status.innerText = "🔴 Capturing mic feed...";
                } catch (err) {
                    status.innerText = "❌ Microphone access failed.";
                    console.error(err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🎤 RECORD";
                recordBtn.classList.remove('recording');
            }
        });

        function stopEverything() {
            activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
            activeSources = [];
        }

        function playSlice(idx) {
            if (!mainBuffer || idx === null) return;
            stopEverything(); 
            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();
            source.buffer = mainBuffer;
            
            const sliceWidth = mainBuffer.duration / totalPieces;
            const startOffset = idx * sliceWidth;
            const playDuration = sliceWidth;

            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(1, audioCtx.currentTime + 0.01);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime + playDuration - 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + playDuration);
            
            source.start(0, startOffset, playDuration);
            activeSources.push(source);
        }

        function playReference() {
            if (!mainBuffer) return;
            stopEverything();
            const source = audioCtx.createBufferSource();
            source.buffer = mainBuffer;
            source.connect(audioCtx.destination);
            source.start(0);
            activeSources.push(source);
        }

        function extractWaveformData(buffer, pointsNeeded) {
            if (!buffer) return new Float32Array(pointsNeeded).fill(0);
            const rawData = buffer.getChannelData(0);
            const step = Math.floor(rawData.length / pointsNeeded);
            const peaks = new Float32Array(pointsNeeded);
            for (let i = 0; i < pointsNeeded; i++) {
                let max = 0; let start = i * step;
                for (let j = 0; j < step; j++) {
                    let val = Math.abs(rawData[start + j] || 0);
                    if (val > max) max = val;
                }
                peaks[i] = max;
            }
            return peaks;
        }

        function generateWaveformGridImage() {
            if (!mainBuffer) return;
            const canvas = document.createElement('canvas');
            const size = 600; 
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, size, size);

            const cellSize = size / gridSize;
            const totalPoints = size * gridSize; 
            const peaks = extractWaveformData(mainBuffer, totalPoints);
            
            ctx.strokeStyle = '#a855f7'; 
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#a855f7';
            
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const cellIndex = (row * gridSize) + col;
                    const startX = col * cellSize;
                    const centerY = (row * cellSize) + (cellSize / 2);
                    
                    ctx.beginPath();
                    const segmentPoints = size / gridSize;
                    const segmentStartPeakIdx = cellIndex * segmentPoints;

                    for (let localX = 0; localX < cellSize; localX++) {
                        const globalX = startX + localX;
                        const peakIdx = Math.floor(segmentStartPeakIdx + ((localX / cellSize) * segmentPoints));
                        const amp = (peaks[peakIdx] || 0) * (cellSize / 2.3); 
                        
                        if (localX === 0) ctx.moveTo(globalX, centerY);
                        ctx.lineTo(globalX, centerY - amp);
                        ctx.lineTo(globalX, centerY + amp);
                    }
                    ctx.stroke();
                }
            }
            waveformImageSrc = canvas.toDataURL();
        }

        function updateGhostCanvas() {
            const canvas = document.getElementById('ghost-wave');
            const container = document.getElementById('grid-container');
            const size = container.clientWidth - 20;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, size, size);

            if (currentMode === 'hard') return;
            
            let activeBgSrc = null;
            if (currentMode === 'easy') {
                activeBgSrc = uploadedImageSrc || waveformImageSrc;
            } else if (currentMode === 'medium') {
                activeBgSrc = waveformImageSrc;
            }
            
            if (activeBgSrc) {
                const img = new Image();
                img.onload = () => {
                    ctx.globalAlpha = 0.15;
                    ctx.drawImage(img, 0, 0, size, size);
                };
                img.src = activeBgSrc;
            }
        }

        function handleTileClick(index) {
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const emptyRow = Math.floor(emptyIndex / gridSize);
            const emptyCol = emptyIndex % gridSize;

            const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

            if (isAdjacent) {
                const movedPiece = pieces[index];
                pieces[emptyIndex] = movedPiece;
                pieces[index] = null;
                emptyIndex = index;
                
                playSlice(movedPiece);
                render();
            } else if (pieces[index] !== null) {
                playSlice(pieces[index]);
            }
        }

        function render() {
            const grid = document.getElementById('grid');
            const container = document.getElementById('grid-container');
            grid.innerHTML = '';
            
            const isSolved = pieces.every((p, i) => (i === totalPieces - 1 ? p === null : p === i));

            let activePieceBg = null;
            if (currentMode === 'easy') {
                activePieceBg = uploadedImageSrc || waveformImageSrc;
            } else if (currentMode === 'medium') {
                activePieceBg = waveformImageSrc;
            }

            pieces.forEach((pIdx, i) => {
                const div = document.createElement('div');
                div.className = `piece ${pIdx === i ? 'correct' : ''}`;
                
                if (pIdx === null) {
                    div.classList.add('empty');
                } else {
                    const origCol = pIdx % gridSize;
                    const origRow = Math.floor(pIdx / gridSize);
                    
                    if (currentMode === 'hard') {
                        div.style.backgroundImage = 'none';
                        div.textContent = '🎵';
                    } else {
                        div.textContent = '';
                        if (activePieceBg) {
                            div.style.backgroundImage = `url(${activePieceBg})`;
                            div.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                            div.style.backgroundPosition = `${(origCol / (gridSize - 1)) * 100}% ${(origRow / (gridSize - 1)) * 100}%`;
                        } else {
                            div.style.backgroundImage = 'none';
                        }
                    }

                    div.onclick = () => handleTileClick(i);
                }
                
                grid.appendChild(div);
            });

            if (isSolved && mainBuffer) { 
                document.getElementById('status').innerText = "🎉 SLIDER SOLVED PERFECTLY!";
                container.classList.add('victory');
                playReference();
            }
        }
        
        window.addEventListener('resize', updateGhostCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            setMode('easy');
        });
    </script>
</body>
</html>
