<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Spatial Audio Sphere Trainer</title>
    <!-- Three.js and OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.90);
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --text-color: #e2e8f0;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Floating HUD Controls */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .hud-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        button, .btn-label {
            background: var(--accent-cyan);
            color: #0b0f19;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        button:hover, .btn-label:hover { filter: brightness(1.15); }
        button:active, .btn-label:active { transform: scale(0.96); }
        button.secondary { background: #334155; color: #fff; }
        button.danger { background: var(--accent-red); color: #fff; }
        button.active-toggle { background: var(--accent-green); color: #fff; }

        /* Minimizing utilities */
        .hud-panel.minimized {
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.65);
        }
        .hud-panel.minimized .hide-when-minimized {
            display: none !important;
        }

        #bottom-panel {
            max-width: 540px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .slider-row {
            display: grid;
            grid-template-columns: 75px 1fr 50px 32px;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }
        input[type=range]:disabled { opacity: 0.35; cursor: not-allowed; }

        .readout {
            font-family: monospace;
            color: var(--accent-cyan);
            text-align: right;
            font-size: 0.8rem;
        }

        .lock-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 3px;
            font-size: 0.8rem;
            cursor: pointer;
            min-width: 30px;
            height: 26px;
        }
        .lock-btn.locked { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

        #touch-hint {
            position: absolute;
            bottom: 8px;
            left: 12px;
            font-size: 0.72rem;
            color: #64748b;
            pointer-events: none;
        }

        @media (max-width: 650px) {
            #touch-hint { display: none; }
            #top-bar { justify-content: space-between; }
            .btn-group { gap: 4px; }
            button, .btn-label { padding: 6px 8px; font-size: 0.72rem; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-overlay">
    <!-- Top Navigation & Audio Control Bar -->
    <div id="top-bar" class="hud-panel">
        <div class="left-controls">
            <button id="homeBtn" class="secondary" onclick="window.location.href='/Clean-start/index.html'">◀ HOME</button>
            <div class="hide-when-minimized">
                <h1>3D Audio Sphere</h1>
                <div id="audio-status" style="font-size: 0.7rem; color: #64748b;">STANDBY</div>
            </div>
        </div>

        <div class="btn-group">
            <label class="btn-label secondary hide-when-minimized">
                📁 LOAD
                <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
            </label>
            <button id="startBtn">▶ PLAY</button>
            <button id="stopBtn" class="danger">⏹ STOP</button>
            <button id="modelBtn" class="secondary hide-when-minimized" title="Toggle between HRTF Pinna modeling and EqualPower stereo">MODEL: HRTF</button>
            <button id="autoMoveBtn" class="secondary hide-when-minimized">🔄 AUTO: OFF</button>
            <button id="trackBtn" class="secondary hide-when-minimized">HEAD TRACK: OFF</button>
            <button id="toggleHudBtn" class="secondary" title="Minimise Windows">👁 HIDE HUD</button>
        </div>
    </div>

    <div id="touch-hint">
        • <strong>Touch & Drag Sound Orb:</strong> Move audio source in 3D<br>
        • <strong>Drag Space:</strong> Orbit Camera
    </div>

    <!-- Sliders and Axis Locks -->
    <div id="bottom-panel" class="hud-panel">
        <div class="panel-header">
            <span>SPATIAL COORDINATES</span>
            <button id="minBottomBtn" class="lock-btn" style="width: auto; padding: 2px 8px;" title="Minimize Panel">▼</button>
        </div>
        <div id="slider-content">
            <div class="slider-row">
                <span>AZIMUTH</span>
                <input type="range" id="azimuthSlider" min="0" max="360" step="1" value="45">
                <span class="readout" id="azimuthVal">45°</span>
                <button id="lockAzimuth" class="lock-btn" title="Lock Azimuth">🔓</button>
            </div>
            <div class="slider-row">
                <span>ELEVATION</span>
                <input type="range" id="elevationSlider" min="-90" max="90" step="1" value="0">
                <span class="readout" id="elevationVal">0°</span>
                <button id="lockElevation" class="lock-btn" title="Lock Elevation">🔓</button>
            </div>
            <div class="slider-row">
                <span>DISTANCE</span>
                <input type="range" id="distanceSlider" min="1" max="6" step="0.1" value="3.5">
                <span class="readout" id="distanceVal">3.5m</span>
                <button id="lockDistance" class="lock-btn" title="Lock Distance">🔓</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* ==========================================================
       1. WEB AUDIO API & HRTF PANNER SETUP
       ========================================================== */
    let audioCtx = null, panner = null;
    let activeSources = [];
    let isRunning = false;
    let trackHead = false;
    let autoMove = false;
    let loadedAudioBuffer = null;
    let currentPanningModel = 'HRTF'; // 'HRTF' | 'equalpower'

    const locks = { azimuth: false, elevation: false, distance: false };

    function ensureAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            panner = new PannerNode(audioCtx, {
                panningModel: currentPanningModel,
                distanceModel: 'inverse',
                refDistance: 1.5,
                maxDistance: 100,
                rolloffFactor: 1
            });
            panner.connect(audioCtx.destination);
        }
    }

    // Stop only active sound nodes without suspending context
    function stopActiveSourcesOnly() {
        activeSources.forEach(s => {
            try { s.stop(); } catch(e) {}
            try { s.disconnect(); } catch(e) {}
        });
        activeSources = [];
    }

    // User pressed STOP button: stop sounds and cleanly suspend context
    function stopPlayback() {
        stopActiveSourcesOnly();

        if (audioCtx && audioCtx.state === 'running') {
            audioCtx.suspend();
        }

        isRunning = false;
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('audio-status');
        startBtn.innerText = "▶ PLAY";
        startBtn.style.opacity = "1";
        statusEl.innerText = "AUDIO STOPPED";
        statusEl.style.color = "#94a3b8";
    }

    async function startAudio() {
        ensureAudioContext();
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }
        
        // Stop any old buffer sources, but KEEP the audioContext running
        stopActiveSourcesOnly();

        const statusEl = document.getElementById('audio-status');
        const startBtn = document.getElementById('startBtn');

        if (loadedAudioBuffer) {
            const src = audioCtx.createBufferSource();
            src.buffer = loadedAudioBuffer;
            src.loop = true; // Complete uninterrupted loop
            src.connect(panner);
            src.start(0);
            activeSources.push(src);

            statusEl.innerText = "PLAYING: Local Audio";
            statusEl.style.color = "#10b981";
        } else {
            try {
                const resp = await fetch('./mysound.mp3');
                if (!resp.ok) throw new Error("File not found");
                loadedAudioBuffer = await audioCtx.decodeAudioData(await resp.arrayBuffer());

                const src = audioCtx.createBufferSource();
                src.buffer = loadedAudioBuffer;
                src.loop = true; // Complete uninterrupted loop
                src.connect(panner);
                src.start(0);
                activeSources.push(src);

                statusEl.innerText = "PLAYING: mysound.mp3";
                statusEl.style.color = "#38bdf8";
            } catch (e) {
                // Continuous Synth tone fallback
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(panner);
                osc.start(0);
                activeSources.push(osc);

                statusEl.innerText = "SYNTH DEMO TONE (Load file to replace)";
                statusEl.style.color = "#f59e0b";
            }
        }

        startBtn.innerText = "PLAYING";
        startBtn.style.opacity = "0.7";
        isRunning = true;
        syncSoundPosition();
    }

    // Toggle Panning Model
    const modelBtn = document.getElementById('modelBtn');
    modelBtn.onclick = () => {
        if (currentPanningModel === 'HRTF') {
            currentPanningModel = 'equalpower';
            modelBtn.innerText = "MODEL: STEREO";
            modelBtn.title = "Clean EqualPower panning (No frequency roll-off)";
        } else {
            currentPanningModel = 'HRTF';
            modelBtn.innerText = "MODEL: HRTF";
            modelBtn.title = "Anatomical HRTF (Simulates head & ear pinna filtering)";
        }
        if (panner) panner.panningModel = currentPanningModel;
    };

    // Audio upload
    document.getElementById('audioUpload').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        ensureAudioContext();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const statusEl = document.getElementById('audio-status');
        statusEl.innerText = "DECODING AUDIO FILE...";
        statusEl.style.color = "#38bdf8";

        const reader = new FileReader();
        reader.onload = async function(ev) {
            try {
                loadedAudioBuffer = await audioCtx.decodeAudioData(ev.target.result);
                startAudio();
            } catch (err) {
                console.error("Audio decode error:", err);
                statusEl.innerText = "FAILED TO DECODE AUDIO";
                statusEl.style.color = "#ef4444";
            }
        };
        reader.readAsArrayBuffer(file);
    });

    /* ==========================================================
       2. THREE.JS 3D SCENE & HUMAN HEAD MODEL
       ========================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0f19, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 14;
    controls.minDistance = 2;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xa855f7, 0.8);
    rimLight.position.set(-5, 4, -5);
    scene.add(rimLight);

    // Floor Grid
    const grid = new THREE.GridHelper(14, 28, 0x1e293b, 0x0f172a);
    grid.position.y = -1.6;
    scene.add(grid);

    // Holographic Bounding Sphere
    const sphereRadius = 4.0;
    const sphereGeo = new THREE.SphereGeometry(sphereRadius, 32, 24);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.08 });
    scene.add(new THREE.Mesh(sphereGeo, sphereMat));

    // Equator Ring
    const ringGeo = new THREE.RingGeometry(sphereRadius - 0.02, sphereRadius + 0.02, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
    const equatorRing = new THREE.Mesh(ringGeo, ringMat);
    equatorRing.rotation.x = Math.PI / 2;
    scene.add(equatorRing);

    /* --- Stylized 3D Head Model (Face points along +Z) --- */
    const headGroup = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: 0x24324d, roughness: 0.4, metalness: 0.2, flatShading: true });

    // Cranium
    const craniumGeo = new THREE.SphereGeometry(0.7, 16, 16);
    craniumGeo.scale(0.85, 1.1, 0.95);
    const cranium = new THREE.Mesh(craniumGeo, skinMat);
    cranium.position.y = 0.2;
    headGroup.add(cranium);

    // Jaw / Chin
    const jawGeo = new THREE.CylinderGeometry(0.45, 0.25, 0.6, 12);
    const jaw = new THREE.Mesh(jawGeo, skinMat);
    jaw.position.set(0, -0.3, 0.1);
    headGroup.add(jaw);

    // Nose (Faces +Z)
    const noseGeo = new THREE.ConeGeometry(0.12, 0.35, 6);
    const nose = new THREE.Mesh(noseGeo, skinMat);
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, 0.05, 0.68);
    headGroup.add(nose);

    // Cyan Gaze Indicators
    const eyeGeo = new THREE.SphereGeometry(0.07, 12, 12);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.22, 0.18, 0.58);
    headGroup.add(leftEye);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.22, 0.18, 0.58);
    headGroup.add(rightEye);

    // Binaural Ears
    const earGeo = new THREE.BoxGeometry(0.12, 0.32, 0.2);
    const earMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, emissive: 0x0284c7, emissiveIntensity: 0.3 });
    const leftEar = new THREE.Mesh(earGeo, earMat);
    leftEar.position.set(-0.62, 0.1, 0);
    headGroup.add(leftEar);
    const rightEar = new THREE.Mesh(earGeo, earMat);
    rightEar.position.set(0.62, 0.1, 0);
    headGroup.add(rightEar);

    // Bust
    const bustGeo = new THREE.CylinderGeometry(0.28, 0.85, 0.8, 16);
    const bustMat = new THREE.MeshStandardMaterial({ color: 0x131d31, roughness: 0.6 });
    const bust = new THREE.Mesh(bustGeo, bustMat);
    bust.position.set(0, -0.85, 0);
    headGroup.add(bust);

    scene.add(headGroup);

    /* --- Sound Orb --- */
    const orbGroup = new THREE.Group();
    const orbCore = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    orbGroup.add(orbCore);

    const orbHalo = new THREE.Mesh(new THREE.SphereGeometry(0.36, 24, 24), new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.25, wireframe: true }));
    orbGroup.add(orbHalo);

    // Generous hitbox for easy mobile dragging
    const grabHitbox = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshBasicMaterial({ visible: false }));
    orbGroup.add(grabHitbox);

    const soundLight = new THREE.PointLight(0xef4444, 2, 8);
    orbGroup.add(soundLight);
    scene.add(orbGroup);

    // Tracer Line
    const soundRay = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0)]),
        new THREE.LineDashedMaterial({ color: 0xef4444, dashSize: 0.15, gapSize: 0.08, transparent: true, opacity: 0.6 })
    );
    scene.add(soundRay);

    /* ==========================================================
       3. SPATIAL POSITION MATH & SYNCHRONIZATION
       ========================================================== */
    const azimuthSlider = document.getElementById('azimuthSlider');
    const elevationSlider = document.getElementById('elevationSlider');
    const distanceSlider = document.getElementById('distanceSlider');

    const azimuthVal = document.getElementById('azimuthVal');
    const elevationVal = document.getElementById('elevationVal');
    const distanceVal = document.getElementById('distanceVal');

    function syncSoundPosition() {
        const azDeg = parseFloat(azimuthSlider.value);
        const elDeg = parseFloat(elevationSlider.value);
        const dist = parseFloat(distanceSlider.value);

        azimuthVal.innerText = `${Math.round(azDeg)}°`;
        elevationVal.innerText = `${Math.round(elDeg)}°`;
        distanceVal.innerText = `${dist.toFixed(1)}m`;

        const azRad = (azDeg - 90) * (Math.PI / 180);
        const elRad = elDeg * (Math.PI / 180);

        const x = dist * Math.cos(elRad) * Math.cos(azRad);
        const y = dist * Math.sin(elRad);
        const z = dist * Math.cos(elRad) * Math.sin(azRad);

        orbGroup.position.set(x, y, z);

        soundRay.geometry.setFromPoints([new THREE.Vector3(0, 0.15, 0), orbGroup.position]);
        soundRay.computeLineDistances();

        // Direct value assignment avoids timeline queue overflow
        if (panner) {
            panner.positionX.value = x;
            panner.positionY.value = y;
            panner.positionZ.value = z;
        }

        // Head Tracking
        if (trackHead) {
            headGroup.lookAt(x, y, z);
        } else {
            headGroup.lookAt(0, 0, -100);
        }

        // Synchronize Web Audio Listener to Head Orientation
        if (audioCtx && audioCtx.listener) {
            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(headGroup.quaternion).normalize();
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(headGroup.quaternion).normalize();

            if (audioCtx.listener.forwardX) {
                audioCtx.listener.forwardX.value = forward.x;
                audioCtx.listener.forwardY.value = forward.y;
                audioCtx.listener.forwardZ.value = forward.z;
                audioCtx.listener.upX.value = up.x;
                audioCtx.listener.upY.value = up.y;
                audioCtx.listener.upZ.value = up.z;
            } else {
                audioCtx.listener.setOrientation(forward.x, forward.y, forward.z, up.x, up.y, up.z);
            }
        }
    }

    azimuthSlider.oninput = syncSoundPosition;
    elevationSlider.oninput = syncSoundPosition;
    distanceSlider.oninput = syncSoundPosition;

    /* ==========================================================
       4. TOUCH SCREEN & MOUSE 3D ORB DRAGGING
       ========================================================== */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let isDraggingOrb = false;

    function getPointerPos(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        pointer.x = (clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(clientY / window.innerHeight) * 2 + 1;
    }

    function onPointerDown(e) {
        if (e.target.closest('#ui-overlay')) return;
        getPointerPos(e);
        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects([grabHitbox, orbCore, orbHalo], true);
        if (intersects.length > 0) {
            isDraggingOrb = true;
            controls.enabled = false;
        }
    }

    function onPointerMove(e) {
        if (!isDraggingOrb) return;
        getPointerPos(e);
        raycaster.setFromCamera(pointer, camera);

        const currentDist = parseFloat(distanceSlider.value);
        const dragSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), currentDist);
        const intersectPoint = new THREE.Vector3();

        if (raycaster.ray.intersectSphere(dragSphere, intersectPoint)) {
            const x = intersectPoint.x;
            const y = intersectPoint.y;
            const z = intersectPoint.z;

            if (!locks.elevation) {
                const elDeg = Math.asin(Math.max(-1, Math.min(1, y / currentDist))) * (180 / Math.PI);
                elevationSlider.value = elDeg;
            }

            if (!locks.azimuth) {
                let azDeg = (Math.atan2(z, x) * (180 / Math.PI)) + 90;
                if (azDeg < 0) azDeg += 360;
                azimuthSlider.value = azDeg;
            }

            syncSoundPosition();
        }
    }

    function onPointerUp() {
        if (isDraggingOrb) {
            isDraggingOrb = false;
            controls.enabled = true;
        }
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);
    window.addEventListener('touchcancel', onPointerUp);

    /* ==========================================================
       5. AXIS LOCKS & HUD MINIMIZING
       ========================================================== */
    function setupLock(btnId, sliderId, lockKey) {
        const btn = document.getElementById(btnId);
        const slider = document.getElementById(sliderId);

        btn.onclick = () => {
            locks[lockKey] = !locks[lockKey];
            if (locks[lockKey]) {
                btn.classList.add('locked');
                btn.innerText = '🔒';
                slider.disabled = true;
            } else {
                btn.classList.remove('locked');
                btn.innerText = '🔓';
                slider.disabled = false;
            }
        };
    }

    setupLock('lockAzimuth', 'azimuthSlider', 'azimuth');
    setupLock('lockElevation', 'elevationSlider', 'elevation');
    setupLock('lockDistance', 'distanceSlider', 'distance');

    // Master HUD Minimize Button
    let hudMinimized = false;
    const toggleHudBtn = document.getElementById('toggleHudBtn');
    const topBar = document.getElementById('top-bar');
    const bottomPanel = document.getElementById('bottom-panel');
    const sliderContent = document.getElementById('slider-content');
    const minBottomBtn = document.getElementById('minBottomBtn');

    toggleHudBtn.onclick = () => {
        hudMinimized = !hudMinimized;
        if (hudMinimized) {
            topBar.classList.add('minimized');
            bottomPanel.style.display = 'none';
            toggleHudBtn.innerText = "👁 SHOW HUD";
        } else {
            topBar.classList.remove('minimized');
            bottomPanel.style.display = 'flex';
            toggleHudBtn.innerText = "👁 HIDE HUD";
        }
    };

    // Bottom Panel Quick-Collapse
    let bottomMinimized = false;
    minBottomBtn.onclick = () => {
        bottomMinimized = !bottomMinimized;
        if (bottomMinimized) {
            sliderContent.style.display = 'none';
            minBottomBtn.innerText = "▲";
        } else {
            sliderContent.style.display = 'block';
            minBottomBtn.innerText = "▼";
        }
    };

    /* ==========================================================
       6. BUTTON LISTENERS & ANIMATION LOOP
       ========================================================== */
    document.getElementById('startBtn').onclick = startAudio;
    document.getElementById('stopBtn').onclick = stopPlayback;

    const autoMoveBtn = document.getElementById('autoMoveBtn');
    autoMoveBtn.onclick = () => {
        autoMove = !autoMove;
        if (autoMove) {
            autoMoveBtn.classList.remove('secondary');
            autoMoveBtn.classList.add('active-toggle');
            autoMoveBtn.innerText = "🔄 AUTO: ON";
        } else {
            autoMoveBtn.classList.remove('active-toggle');
            autoMoveBtn.classList.add('secondary');
            autoMoveBtn.innerText = "🔄 AUTO: OFF";
        }
    };

    const trackBtn = document.getElementById('trackBtn');
    trackBtn.onclick = () => {
        trackHead = !trackHead;
        if (trackHead) {
            trackBtn.classList.remove('secondary');
            trackBtn.classList.add('active-toggle');
            trackBtn.innerText = "HEAD TRACK: ON";
        } else {
            trackBtn.classList.remove('active-toggle');
            trackBtn.classList.add('secondary');
            trackBtn.innerText = "HEAD TRACK: OFF";
        }
        syncSoundPosition();
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const elapsedTime = clock.getElapsedTime();

        if (autoMove && !isDraggingOrb) {
            let changed = false;

            if (!locks.azimuth) {
                let currentAz = parseFloat(azimuthSlider.value);
                azimuthSlider.value = (currentAz + delta * 30) % 360;
                changed = true;
            }

            if (!locks.elevation) {
                elevationSlider.value = Math.sin(elapsedTime * 0.8) * 30;
                changed = true;
            }

            if (!locks.distance) {
                distanceSlider.value = 3.2 + Math.cos(elapsedTime * 0.5) * 1.0;
                changed = true;
            }

            if (changed) syncSoundPosition();
        }

        const pulse = 1 + Math.sin(elapsedTime * 4) * 0.12;
        orbHalo.scale.set(pulse, pulse, pulse);

        controls.update();
        renderer.render(scene, camera);
    }

    syncSoundPosition();
    animate();
</script>
</body>
</html>
